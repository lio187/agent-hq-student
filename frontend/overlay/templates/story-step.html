<!-- Story · step (1080×1920): one step with a short explanation. -->
<main class="slide">
<header class="top"><div class="brand">{{logo}}<span class="name">{{name}}</span></div><span class="count">/ {{total}}</span></header>
<section class="content">
<span class="badge">{{number}}</span>
<h1 class="h" data-size="{{headingSize}}">{{heading}}</h1>
<p class="b" data-size="{{bodySize}}">{{body}}</p>
</section>
<footer class="bottom"><span class="foot">{{footer}}</span></footer>
</main>
