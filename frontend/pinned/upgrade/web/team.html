<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent HQ</title>
<link rel="preload" href="/static/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/tokens.css?v=l20261012160923">
<link rel="stylesheet" href="/static/style.css?v=l20261012160923">
<link rel="stylesheet" href="/static/shell.css?v=l20261012160923">
<style>
/* Team shell (9 Oct 2026): the workspace pages a team member's role allows, without the office or the Chief dock. */
body.hq-team{--dock-height:0px;background:var(--bg-canvas);overflow:hidden}
body.hq-team #cockpit-panel{bottom:var(--shell-gap)}
.team-who{margin:6px 4px 12px;padding:10px 12px;border:1px solid var(--border-soft);border-radius:10px;background:var(--bg-panel)}
.team-who strong{display:block;font:590 13px/1.3 var(--font-ui);color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-who small{display:block;margin-top:2px;font-size:12px;color:var(--text-secondary)}
.team-state{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--text-body);font:15px/1.5 var(--font-ui)}
.team-state h1{margin:0 0 8px;font:590 20px/1.3 var(--font-ui);color:var(--text-primary)}
#team-toggle{display:none}
@media(max-width:900px){#team-toggle{display:inline-flex;position:fixed;z-index:95;top:10px;left:10px}body.sidebar-open #hq-nav.hq-sidebar{transform:none}}
</style>
</head>
<body class="hq-team">
<button type="button" id="team-toggle" aria-controls="hq-nav" aria-label="Open navigation">☰</button>
<nav id="hq-nav" class="hq-sidebar" aria-label="Agent HQ pages"></nav>
<section id="cockpit-panel" aria-label="Agent HQ workspace"></section>
<div class="team-state" id="team-state" role="status">Opening Agent HQ…</div>
<script type="module" src="/static/dist/team.js?v=l20261012160923"></script>
</body>
</html>
