<!-- Carousel · call to action (1080×1350): the ask; footer = the button text. -->
<main class="slide">
<header class="top"><span class="name">{{name}}</span><span class="count"><b>{{number}}</b> / {{total}}</span></header>
<section class="content">
<h1 class="h" data-size="{{headingSize}}">{{heading}}</h1>
<p class="b" data-size="{{bodySize}}">{{body}}</p>
<p class="pill">{{footer}}</p>
</section>
<footer class="bottom"><div class="sign">{{logo}}<span class="handle">{{handle}}</span></div></footer>
</main>
