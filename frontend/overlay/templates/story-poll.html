<!-- Story · question (1080×1920): heading = the question, items = the answers (two to four). -->
<main class="slide">
<header class="top"><div class="brand">{{logo}}<span class="name">{{name}}</span></div><span class="count"><b>{{number}}</b> / {{total}}</span></header>
<section class="content">
<p class="kicker">{{footer}}</p>
<h1 class="h" data-size="{{headingSize}}">{{heading}}</h1>
<ol class="items" data-n="{{itemCount}}">{{items}}</ol>
<p class="b" data-size="{{bodySize}}">{{body}}</p>
</section>
<footer class="bottom"><span class="handle">{{handle}}</span></footer>
</main>
