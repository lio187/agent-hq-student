<!-- Carousel · cover (1080×1350): the hook. footer = a small label above the heading. -->
<main class="slide">
<header class="top"><div class="brand">{{logo}}<span class="name">{{name}}</span></div><span class="count"><b>{{number}}</b> / {{total}}</span></header>
<section class="content">
<div class="rule"></div>
<p class="kicker">{{footer}}</p>
<h1 class="h" data-size="{{headingSize}}">{{heading}}</h1>
<p class="b" data-size="{{bodySize}}">{{body}}</p>
</section>
<footer class="bottom"><span class="handle">{{handle}}</span><span class="next">&rarr;</span></footer>
</main>
