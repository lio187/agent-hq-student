<!-- Carousel · quote (1080×1350): heading = the quote, body = who said it. -->
<main class="slide">
<header class="top"><div class="brand">{{logo}}<span class="name">{{name}}</span></div><span class="count"><b>{{number}}</b> / {{total}}</span></header>
<section class="content">
<div class="mark" aria-hidden="true">&ldquo;</div>
<blockquote class="h" data-size="{{headingSize}}">{{heading}}</blockquote>
<p class="b" data-size="{{bodySize}}">{{body}}</p>
</section>
<footer class="bottom"><span class="handle">{{handle}}</span><span class="foot">{{footer}}</span><span class="next">&rarr;</span></footer>
</main>
