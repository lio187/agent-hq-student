<!-- Carousel · point (1080×1350): one idea with a short explanation. -->
<main class="slide">
<header class="top"><div class="brand">{{logo}}<span class="name">{{name}}</span></div><span class="count">/ {{total}}</span></header>
<section class="content">
<span class="num">{{number}}</span>
<h1 class="h" data-size="{{headingSize}}">{{heading}}</h1>
<p class="b" data-size="{{bodySize}}">{{body}}</p>
</section>
<footer class="bottom"><span class="handle">{{handle}}</span><span class="foot">{{footer}}</span><span class="next">&rarr;</span></footer>
</main>
